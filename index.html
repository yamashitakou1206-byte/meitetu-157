<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#050505">
<title>SOULBOUND - オリジナルRPG</title>
<style>
:root{color-scheme:dark;--gold:#ffdc55;--white:#f5f5f5;--red:#ff4242}
*{box-sizing:border-box}
body{margin:0;background:#050505;color:var(--white);font-family:"Courier New",monospace;display:flex;justify-content:center;min-height:100vh}
#game{width:min(100%,900px);padding:18px 16px 28px;display:flex;flex-direction:column;gap:14px}
header{text-align:center;border-bottom:2px solid #555;padding:8px}
h1{font-size:clamp(25px,5vw,42px);letter-spacing:7px;margin:0;color:#fff;text-shadow:3px 3px #7b1d1d}
.subtitle{color:#aaa;font-size:12px;margin-top:6px}
#scene{height:clamp(190px,32vh,280px);position:relative;display:flex;align-items:center;justify-content:center;overflow:hidden}
#enemy{font-size:clamp(64px,13vw,110px);filter:drop-shadow(0 0 12px #8b8b8b);transition:transform .15s}
#enemyName{position:absolute;bottom:8px;left:0;right:0;text-align:center;font-size:18px}
#dialogue{min-height:64px;border:2px solid #eee;padding:12px 14px;font-size:16px;line-height:1.55}
#status{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;font-size:15px}
#hpbar{width:120px;height:14px;background:#5a1717;border:1px solid #eee;display:inline-block;vertical-align:middle;margin-left:8px}
#hpfill{height:100%;width:100%;background:#f4dc4b;transition:width .2s}
#arena{display:none;position:relative;width:min(100%,520px);height:260px;margin:auto;border:3px solid white;background:#050505;overflow:hidden;touch-action:none}
#soul{position:absolute;width:14px;height:14px;background:#ff3030;transform:rotate(45deg);left:calc(50% - 7px);top:calc(50% - 7px);box-shadow:0 0 8px #ff3030;z-index:2}
#soul:before,#soul:after{content:"";position:absolute;width:14px;height:14px;background:#ff3030;border-radius:50%}
#soul:before{left:-7px;top:0}#soul:after{left:0;top:-7px}
.bullet{position:absolute;width:12px;height:12px;background:#fff;border-radius:2px;box-shadow:0 0 5px #fff}
#commands{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
button{font: bold 16px "Courier New",monospace;color:var(--gold);background:#080808;border:2px solid var(--gold);padding:13px 5px;cursor:pointer;min-height:48px}
button:hover,button:focus-visible{background:#3a2d08;outline:2px solid white;outline-offset:2px}
button:disabled{opacity:.4;cursor:not-allowed}
#choices{display:flex;gap:8px;flex-wrap:wrap}
#choices button{flex:1;min-width:110px}
#controls{display:none;grid-template-columns:repeat(3,52px);grid-template-rows:repeat(2,44px);gap:5px;justify-content:center}
#controls button{padding:0;font-size:20px}
#controls .up{grid-column:2;grid-row:1}#controls .left{grid-column:1;grid-row:2}#controls .down{grid-column:2;grid-row:2}#controls .right{grid-column:3;grid-row:2}
.hint{text-align:center;color:#999;font-size:12px;line-height:1.5}
@media(max-width:560px){#commands{grid-template-columns:repeat(2,1fr)}#controls{display:grid}#dialogue{font-size:14px}#arena{height:230px}}
</style>
</head>
<body>
<main id="game">
<header><h1>SOULBOUND</h1><div class="subtitle">A SMALL RPG ABOUT CHOICES</div></header>
<section id="scene"><div id="enemy">♟</div><div id="enemyName">迷子の番人</div></section>
<div id="status"><span>HP <b id="hpText">20 / 20</b><span id="hpbar"><span id="hpfill"></span></span></span><span id="turnText">TURN 1</span></div>
<div id="dialogue" aria-live="polite">＊ 暗闇の向こうから、小さな影が現れた。</div>
<div id="arena"><div id="soul"></div></div>
<div id="controls" aria-label="魂の移動操作">
<button class="up" data-dir="up">▲</button><button class="left" data-dir="left">◀</button><button class="down" data-dir="down">▼</button><button class="right" data-dir="right">▶</button>
</div>
<div id="choices"></div>
<nav id="commands">
<button data-action="fight">たたかう</button><button data-action="act">こうどう</button><button data-action="item">アイテム</button><button data-action="mercy">みのがす</button>
</nav>
<div class="hint">PC：矢印キー / WASD で魂を移動　・　スマホ：画面下の方向ボタン<br>この作品は既存作品のキャラクター・音楽・画像を使用しないオリジナル作品です。</div>
</main>
<script>
(()=>{
const $=id=>document.getElementById(id);
let hp=20,turn=1,enemyHp=36,phase="menu",invuln=0,raf=0,bullets=[],keys={},soul={x:250,y:125},last=0,attackTimer=0,ending=false;
const arena=$("arena"),soulEl=$("soul"),enemy=$("enemy"),dialogue=$("dialogue"),choices=$("choices");
function say(t){dialogue.textContent="＊ "+t}
function status(){ $("hpText").textContent=hp+" / 20";$("hpfill").style.width=(hp/20*100)+"%";$("turnText").textContent="TURN "+turn}
function clearChoices(){choices.innerHTML=""}
function choice(label,fn){const b=document.createElement("button");b.textContent=label;b.onclick=fn;choices.appendChild(b)}
function lock(v){document.querySelectorAll("#commands button").forEach(b=>b.disabled=v)}
function showMenu(){phase="menu";arena.style.display="none";clearChoices();lock(false);$("controls").style.display="none";say("＊ 迷子の番人が行く手をふさいでいる。")}
function enemyAttack(){phase="dodge";arena.style.display="block";$("controls").style.display=innerWidth<=560?"grid":"none";clearChoices();lock(true);bullets.forEach(b=>b.el.remove());bullets=[];soul={x:arena.clientWidth/2,y:arena.clientHeight/2};drawSoul();say("＊ 番人の攻撃！ ハートを操作して避けよう。");attackTimer=0;last=0;cancelAnimationFrame(raf);raf=requestAnimationFrame(loop)}
function drawSoul(){soulEl.style.left=(soul.x-7)+"px";soulEl.style.top=(soul.y-7)+"px"}
function spawn(){const edge=Math.floor(Math.random()*4),w=arena.clientWidth,h=arena.clientHeight;let x,y,vx,vy; if(edge===0){x=Math.random()*w;y=-10;vx=(Math.random()-.5)*1.8;vy=2.1+Math.random()*1.4}else if(edge===1){x=w+10;y=Math.random()*h;vx=-2.1-Math.random()*1.4;vy=(Math.random()-.5)*1.8}else if(edge===2){x=Math.random()*w;y=h+10;vx=(Math.random()-.5)*1.8;vy=-2.1-Math.random()*1.4}else{x=-10;y=Math.random()*h;vx=2.1+Math.random()*1.4;vy=(Math.random()-.5)*1.8}
const el=document.createElement("i");el.className="bullet";arena.appendChild(el);bullets.push({x,y,vx,vy,el})}
function loop(ts){if(phase!=="dodge")return;const dt=Math.min((ts-last||16)/16,2);last=ts;attackTimer+=dt;
const speed=3.4*dt;if(keys.ArrowUp||keys.w)soul.y-=speed;if(keys.ArrowDown||keys.s)soul.y+=speed;if(keys.ArrowLeft||keys.a)soul.x-=speed;if(keys.ArrowRight||keys.d)soul.x+=speed;
soul.x=Math.max(10,Math.min(arena.clientWidth-10,soul.x));soul.y=Math.max(10,Math.min(arena.clientHeight-10,soul.y));drawSoul();
if(Math.random()<.045)spawn();
for(let i=bullets.length-1;i>=0;i--){const b=bullets[i];b.x+=b.vx*dt;b.y+=b.vy*dt;b.el.style.transform=`translate(${b.x}px,${b.y}px)`;if(Math.hypot(b.x-soul.x,b.y-soul.y)<14&&invuln<=0){hp=Math.max(0,hp-2);invuln=35;status();soulEl.style.opacity=".35";setTimeout(()=>$("soul").style.opacity="1",180);if(hp===0){finish(false);return}}
if(b.x<-30||b.x>arena.clientWidth+30||b.y<-30||b.y>arena.clientHeight+30){b.el.remove();bullets.splice(i,1)}}
if(invuln>0)invuln-=dt;
if(attackTimer>470){cancelAnimationFrame(raf);bullets.forEach(b=>b.el.remove());bullets=[];turn++;status();showMenu();return}
raf=requestAnimationFrame(loop)}
function finish(win){phase="end";ending=true;cancelAnimationFrame(raf);arena.style.display="none";$("controls").style.display="none";lock(true);clearChoices();if(win){enemy.textContent="✦";say("＊ 番人は静かに道をあけた。あなたは戦わずに進むことも、戦うことも選べた。");}else{say("＊ あなたのSOULは力尽きた……。");choice("もう一度",()=>location.reload())}if(win)choice("最初から",()=>location.reload())}
function act(){phase="choice";clearChoices();say("＊ どう行動する？");choice("話しかける",()=>{say("＊ 番人「ここを守る理由を、まだ思い出せないんだ。」");choice("「一緒に思い出そう」",()=>{say("＊ 番人の肩の力が抜けた。");choice("次へ",()=>{enemy.textContent="♡";say("＊ 番人はあなたを通してくれた。");finish(true)})});choice("戻る",showMenu)});choice("観察する",()=>{say("＊ 番人は攻撃の合間に、こちらの様子をうかがっている。");choice("戻る",showMenu)});choice("戻る",showMenu)}
function item(){phase="choice";clearChoices();say("＊ バッグの中を調べた。");if(hp<20)choice("小さな回復薬（HP +6）",()=>{hp=Math.min(20,hp+6);status();say("＊ HPが回復した。");choice("次へ",enemyAttack)});else say("＊ 今は回復する必要がない。");choice("戻る",showMenu)}
function fight(){phase="fight";clearChoices();say("＊ タイミングよく「HIT」を押そう。");choice("HIT",()=>{enemyHp-=12;enemy.style.transform="translateX(8px)";setTimeout(()=>enemy.style.transform="",120);if(enemyHp<=0){finish(true)}else{say("＊ 番人は少しよろめいた。");enemyAttack()}});choice("戻る",showMenu)}
document.querySelectorAll("[data-action]").forEach(b=>b.addEventListener("click",()=>{if(phase!=="menu")return;({fight,act,item,mercy:()=>{say("＊ 番人はまだ警戒している。もう少し話をしてみよう。");enemyAttack()}})[b.dataset.action]()}));
document.addEventListener("keydown",e=>{keys[e.key]=true;if(["ArrowUp","ArrowDown","ArrowLeft","ArrowRight"," "].includes(e.key))e.preventDefault()});
document.addEventListener("keyup",e=>keys[e.key]=false);
document.querySelectorAll("[data-dir]").forEach(b=>{const dir=b.dataset.dir;const map={up:"ArrowUp",down:"ArrowDown",left:"ArrowLeft",right:"ArrowRight"};b.addEventListener("pointerdown",e=>{e.preventDefault();keys[map[dir]]=true});["pointerup","pointerleave","pointercancel"].forEach(ev=>b.addEventListener(ev,()=>keys[map[dir]]=false))});
status();showMenu();
})();
</script>
</body>
</html>
